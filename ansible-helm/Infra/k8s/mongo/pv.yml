apiVersion: v1
kind: PersistentVolume
metadata:
  name: mongo-pv
  labels:
    app: mongo
    env: production
spec:
  capacity: 
    storage: 5Gi
  accessModes:  
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: mongo-storage 
  hostPath:
    path: /mnt/data/mongo-pv/
